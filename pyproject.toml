[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agydra"
dynamic = ["version"]
description = "Multi-profile launcher for the agy CLI (isolated OAuth per profile) on macOS, Linux and Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agydra contributors" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
agydra = "cli:main"

# Flat layout: every module lives at the repo root next to pyproject.toml.
# py-modules (not packages.find) is what setuptools uses for this shape.
[tool.setuptools]
py-modules = [
    "account",
    "agydra",
    "banner",
    "bootstrap",
    "cli",
    "doctor",
    "isolation",
    "keychain",
    "locks",
    "models",
    "orphans",
    "platforms",
    "resolver",
    "runner",
    "store",
    "ui",
    "usage",
    "vocab",
]

[tool.setuptools.dynamic]
# agydra.py holds VERSION at the root of this flat layout; setuptools'
# static reader resolves py-modules from the project root, so a bare
# ``attr = "VERSION"`` here would look in a module that does not exist.
version = { attr = "agydra.VERSION" }
